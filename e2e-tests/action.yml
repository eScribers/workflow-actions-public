name: "Run e2e test"
description: "Run tests..."
inputs:
  pr-number:
    description: 'PR number where those tests was executed'
    default: ""
  project-repo:
    description: 'Project repo was tested'
    default: ""
  action-id:
    description: 'Action ID for preparint link to workflow'
    default: ""
  sender-email-address:
    description: 'Git reference from where it should be deployed'
    default: ""
  sender-email-password:
    description: 'Git reference from where it should be deployed'
    default: ""
  postmark-api:
    description: 'Api key for Postmark'
    default: ""
  git-reference:
    description: 'Git reference from where it should be deployed'
    default: "refs/heads/master"
  dotnet-version:
    description: 'The dotnet version to use'
    default: '6.0.x'
    required: false
  backend-url:
    description: 'URL to tabula deployed'
    required: true
  tabula-login:
    description: 'Login to tabula portal'
    required: true
  tabula-password:
    description: 'Password to tabula portal'
    required: true
  access-key:
    description: 'AWS Access Key from secrets'
    required: true
  secret-key:
    description: 'AWS Secret Key from secrets'
    required: true
  token:
    description: 'Token to github'
    required: true
  pr-title:
    description: 'PR Title'
    required: false
  pr-creator:
    description: 'PR Author'
    required: false
  test-suite:
    description: 'Overwrite test suite file'
    default: 'Smoke.xml'
    required: false
  timeout-minutes:
    description: 'Per-attempt time limit for the test run, in minutes'
    required: false
    default: '25'
  max-attempts:
    description: 'How many times to attempt the test run'
    required: false
    default: '2'
  teams-webhook-url:
    description: 'Webhook for sending notifications to teams'
    required: false
    default: ""
  registration-email-address:
    description: 'Email address for registration'
    required: false
    default: ""
  registration-email-password:
    description: 'Email password  for registration email'
    required: false
    default: ""
  ho-login:
    description: 'HO login'
    required: false
    default: ""
  contractor-login:
    description: 'Contractor login'
    required: false
    default: ""
  contractor-password:
    description: 'Contractor password'
    required: false
    default: ""
  reporter-login:
    description: 'Reporter login'
    required: false
    default: ""
  reporter-password:
    description: 'Reporter password'
    required: false
    default: ""



runs:
  using: "composite"
  steps:
    - name: Checkout tabula-automation-tests repo
      uses: actions/checkout@v5
      with:
        repository: eScribers/tabula-automation-tests
        ref: ${{ inputs.git-reference }}
        token: ${{ inputs.token }}

    - name: Define variables
      run: |
        echo "BACKEND_URL=${{ inputs.backend-url }}" >> $GITHUB_ENV
        echo "TABULA_LOGIN=${{ inputs.tabula-login }}" >> $GITHUB_ENV
        echo "TABULA_PASSWORD=${{ inputs.tabula-password }}" >> $GITHUB_ENV
      shell: bash

    # cuchi/jinja2-action decodes its `variables:` input with unicode_escape, which reads
    # UTF-8 as Latin-1 and turns backslash sequences into control characters (TAB-8682),
    # so the values reach the templates through a JSON data file instead.
    - name: Write template data
      shell: bash
      env:
        E2E_TEMPLATE_BACKEND_URL: ${{ env.BACKEND_URL }}
        E2E_TEMPLATE_TABULA_LOGIN: ${{ env.TABULA_LOGIN }}
        E2E_TEMPLATE_TABULA_PASSWORD: ${{ env.TABULA_PASSWORD }}
        E2E_TEMPLATE_SENDER_EMAIL_ADDRESS: ${{ inputs.sender-email-address }}
        E2E_TEMPLATE_SENDER_EMAIL_PASSWORD: ${{ inputs.sender-email-password }}
        E2E_TEMPLATE_PR_NUMBER: ${{ inputs.pr-number }}
        E2E_TEMPLATE_PROJECT_REPO: ${{ inputs.project-repo }}
        E2E_TEMPLATE_ACTION_ID: ${{ inputs.action-id }}
        E2E_TEMPLATE_PR_TITLE: ${{ inputs.pr-title }}
        E2E_TEMPLATE_PR_AUTHOR: ${{ inputs.pr-creator }}
        E2E_TEMPLATE_POSTMARK_API_KEY: ${{ inputs.postmark-api }}
        E2E_TEMPLATE_TEAMS_WEBHOOK_URL: ${{ inputs.teams-webhook-url }}
        E2E_TEMPLATE_REGISTRATION_EMAIL_ADDRESS: ${{ inputs.registration-email-address }}
        E2E_TEMPLATE_REGISTRATION_EMAIL_PASSWORD: ${{ inputs.registration-email-password }}
        E2E_TEMPLATE_HO_LOGIN: ${{ inputs.ho-login }}
        E2E_TEMPLATE_CONTRACTOR_LOGIN: ${{ inputs.contractor-login }}
        E2E_TEMPLATE_CONTRACTOR_PASSWORD: ${{ inputs.contractor-password }}
        E2E_TEMPLATE_REPORTER_LOGIN: ${{ inputs.reporter-login }}
        E2E_TEMPLATE_REPORTER_PASSWORD: ${{ inputs.reporter-password }}
      run: |
        python3 - <<'PY'
        import json, os

        names = (
            'BACKEND_URL', 'TABULA_LOGIN', 'TABULA_PASSWORD',
            'SENDER_EMAIL_ADDRESS', 'SENDER_EMAIL_PASSWORD',
            'PR_NUMBER', 'PROJECT_REPO', 'ACTION_ID', 'PR_TITLE', 'PR_AUTHOR',
            'POSTMARK_API_KEY', 'TEAMS_WEBHOOK_URL',
            'REGISTRATION_EMAIL_ADDRESS', 'REGISTRATION_EMAIL_PASSWORD',
            'HO_LOGIN', 'CONTRACTOR_LOGIN', 'CONTRACTOR_PASSWORD',
            'REPORTER_LOGIN', 'REPORTER_PASSWORD',
        )
        # rstrip matches the old variables: parser, which stripped each line, so a secret
        # saved with a trailing newline keeps working.
        data = {name: os.environ.get('E2E_TEMPLATE_' + name, '').rstrip() for name in names}

        path = os.path.join(os.environ['RUNNER_TEMP'], 'e2e-tests-template-data.json')
        try:
            os.unlink(path)
        except FileNotFoundError:
            pass
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
        with os.fdopen(fd, 'w', encoding='ascii') as f:
            # ensure_ascii writes non-ASCII as escapes, so the container's locale can't
            # change how the file is read.
            json.dump(data, f, ensure_ascii=True)
        PY

    - name: Setup ${{ inputs.test-suite }} file
      uses: cuchi/jinja2-action@v1.2.0
      with:
        template: ./common/TestSuites/SmokeE2E/${{ inputs.test-suite }}.j2
        output_file: ./common/TestSuites/SmokeE2E/${{ inputs.test-suite }}
        strict: true
        data_file: ${{ runner.temp }}/e2e-tests-template-data.json
        data_format: json

    - name: Setup Login.xml file
      uses: cuchi/jinja2-action@v1.2.0
      with:
        template: ./common/TestSuites/SmokeE2E/Login.xml.j2
        output_file: ./common/TestSuites/SmokeE2E/Login.xml
        strict: true
        data_file: ${{ runner.temp }}/e2e-tests-template-data.json
        data_format: json

    - name: Remove template data
      if: always()
      shell: bash
      run: rm -f -- "$RUNNER_TEMP/e2e-tests-template-data.json"

    - name: Show Authentication.xml
      run: |
        cat ./common/TestSuites/SmokeE2E/${{ inputs.test-suite }} || true
        echo ============
      #     cat ./Automation.Tests/Authentication/Login.cs || true
      shell: bash

    - name: Setup .NET Core SDK ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Pin Chrome 126 (matches bundled Selenium.WebDriver.ChromeDriver)
      id: chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 126.0.6478.55

    - name: Make pinned Chrome the system google-chrome
      shell: bash
      run: |
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome-stable
        sudo mkdir -p /opt/google/chrome
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /opt/google/chrome/chrome
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /opt/google/chrome/google-chrome

    - name: Show Chrome/ChromeDriver versions
      run: |
        /usr/bin/google-chrome --version
        /opt/google/chrome/chrome --version
        chromedriver --version
      shell: bash

    - name: Build project
      run: |
        dotnet build
      shell: bash

    - name: Execute prelogin
      if: ${{ inputs.test-suite == 'Smoke.xml' }}
      run: |
        ./TestPerformer/bin/Debug/net6.0/TestPerformer load ./Automation.Tests/bin/Debug/netcoreapp3.1/Automation.Tests.dll // run ./common/TestSuites/SmokeE2E/Login.xml
      shell: bash

    - name: Run tests
      uses: nick-fields/retry@v4
      with:
        # Default cap of 25 min suits Smoke (a healthy run takes a few minutes): the
        # ephemeral e2e env can vanish mid-run (its DNS record disappears), and the
        # old 180-min budget let a dead-env attempt grind for hours before failing.
        # Long suites on a persistent env (NightTests, ~76 min) pass their own limit.
        timeout_minutes: ${{ inputs.timeout-minutes }}
        max_attempts: ${{ inputs.max-attempts }}
        retry_wait_seconds: 30
        shell: bash
        # Liveness pre-check: if the env is already unreachable (DNS gone / task dead),
        # abort this attempt in seconds instead of accumulating per-test Selenium timeouts.
        command: |
          if ! curl -sfS --max-time 15 -o /dev/null "$BACKEND_URL"; then
            echo "::error::e2e environment unreachable at $BACKEND_URL — aborting attempt (env torn down or task gone)."
            exit 1
          fi
          ./TestPerformer/bin/Debug/net6.0/TestPerformer load ./Automation.Tests/bin/Debug/netcoreapp3.1/Automation.Tests.dll // run ./common/TestSuites/SmokeE2E/${{ inputs.test-suite }}

    - name: Surface FATAL in step summary
      if: failure()
      continue-on-error: true
      shell: bash
      run: |
        # Diagnostics only — must never look like an extra failure. The || true
        # guards the pipefail when Reports/ doesn't exist yet (job failed
        # before TestPerformer ran).
        LATEST=$(ls -td ./TestPerformer/bin/Debug/net6.0/Reports/*/ 2>/dev/null | head -1 || true)
        if [ -n "$LATEST" ] && [ -f "${LATEST}TestPerformer.log" ]; then
          EXCERPT=$(grep -A 50 -B 2 "FATAL" "${LATEST}TestPerformer.log" 2>/dev/null | tail -80 || true)
          if [ -n "$EXCERPT" ]; then
            {
              echo "### Last failure (from TestPerformer.log)"
              echo '```'
              echo "$EXCERPT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

    - name: Upload test reports (GH artifact)
      if: always()
      # Diagnostics must not be load-bearing: a transient artifact-service
      # failure must never turn a green test run red.
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: e2e-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.test-suite }}
        path: ./TestPerformer/bin/Debug/net6.0/Reports/
        retention-days: 30
        if-no-files-found: warn

    - name: Add credentials to Amazon
      uses: "aws-actions/configure-aws-credentials@v6"
      if: always()
      with:
        aws-access-key-id: "${{ inputs.access-key }}"
        aws-region: "us-east-1"
        aws-secret-access-key: "${{ inputs.secret-key }}"

    - name: Collect application logs from CloudWatch
      if: always()
      # Diagnostics only — must never look like an extra failure, and must never
      # hold up the report upload behind a slow or missing log stream.
      continue-on-error: true
      shell: bash
      run: |
        # The environment's log group is destroyed along with the environment, so a
        # failed run's application logs are gone before anyone investigates. Pull
        # them into the report folder now, while the environment still exists, so
        # they travel with the screenshots and page sources (TAB-8440).
        LATEST=$(ls -td ./TestPerformer/bin/Debug/net6.0/Reports/*/ 2>/dev/null | head -1 || true)
        if [ -z "$LATEST" ]; then
          echo "No report folder — nothing to attach application logs to."
          exit 0
        fi

        # https://tabula-e2e-1234-1.escribers.io -> tabula-e2e-1234-1-ecs-cloudwatch-loggroup,
        # which is how terraform names it ("${project}${env_name}-ecs-cloudwatch-loggroup").
        GROUP="$(echo "${{ inputs.backend-url }}" | sed -E 's#^https?://([^./]+).*#\1#')-ecs-cloudwatch-loggroup"
        echo "Collecting application logs from $GROUP"

        # Bounded: a large or unresponsive stream must not stall the upload that follows.
        timeout 120 aws logs tail "$GROUP" --since 3h --format short \
          > "${LATEST}application-logs.txt" 2>&1 || true

        wc -c "${LATEST}application-logs.txt" 2>/dev/null || true

    - name: Upload report to S3
      if: always()
      run: |
        aws s3 cp ./TestPerformer/bin/Debug/net6.0/Reports/ s3://escribers-automation-tests-e2e-reports/ --recursive
      shell: bash

